[package]
name = "ion-desktop"
version = "0.0.0"
description = "Ion OS Phase 0B engineering shell"
authors = ["Ion OS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
